<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1060" viewBox="0 0 1150 1060" role="img" aria-labelledby="title description">
  <title id="title">Comparación de tiempos de los algoritmos de cerradura convexa</title>
  <desc id="description">Tres gráficos: tiempo según porcentaje de puntos en una frontera estrictamente convexa para n igual a diez mil, tiempos en nubes uniformes al crecer n y tiempos en fronteras con lados colineales.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4b5563; }
    .panel-title { font-size: 17px; font-weight: 700; }
    .axis-label { font-size: 13px; }
    .tick { font-size: 12px; fill: #4b5563; }
    .grid { stroke: #d9dee7; stroke-width: 1; }
    .axis { stroke: #4b5563; stroke-width: 1.3; }
    .legend { font-size: 12px; }
    .real-inc { stroke: #2563eb; fill: #2563eb; }
    .real-random { stroke: #dc2626; fill: #dc2626; }
    .int-inc { stroke: #059669; fill: #059669; }
    .int-random { stroke: #9333ea; fill: #9333ea; }
    .line { fill: none; stroke-width: 2.7; stroke-linejoin: round; stroke-linecap: round; }
    .point { stroke: #fff; stroke-width: 1.5; }
  </style>

  <rect width="1150" height="1060" fill="#fff"/>
  <text x="575" y="32" text-anchor="middle" class="title">¿Qué algoritmo conviene según la nube de puntos?</text>
  <text x="575" y="54" text-anchor="middle" class="subtitle">Promedio de 5 ejecuciones · g++ 15.2.0 -O2 · semilla 20261022 · tiempo en ms</text>

  <text x="62" y="85" class="panel-title">A. Frontera estrictamente convexa · n = 10 000</text>
  <text x="62" y="105" class="subtitle">Ambos ejes son logarítmicos. Al aumentar los vértices extremos, crece el costo del random incremental.</text>

  <line x1="100" y1="120" x2="1010" y2="120" class="grid"/>
  <line x1="100" y1="157" x2="1010" y2="157" class="grid"/>
  <line x1="100" y1="277" x2="1010" y2="277" class="grid"/>
  <line x1="100" y1="397" x2="1010" y2="397" class="grid"/>
  <line x1="100" y1="460" x2="1010" y2="460" class="grid"/>
  <line x1="100" y1="120" x2="100" y2="460" class="axis"/>
  <line x1="100" y1="460" x2="1010" y2="460" class="axis"/>
  <text x="88" y="124" text-anchor="end" class="tick">200</text>
  <text x="88" y="161" text-anchor="end" class="tick">100</text>
  <text x="88" y="281" text-anchor="end" class="tick">10</text>
  <text x="88" y="401" text-anchor="end" class="tick">1</text>
  <text x="88" y="464" text-anchor="end" class="tick">0.3</text>
  <text x="34" y="290" transform="rotate(-90 34 290)" text-anchor="middle" class="axis-label">Tiempo promedio (ms, escala logarítmica)</text>

  <polyline points="100,420.6 156.3,418.8 196.3,419.9 252.6,419.5 323.6,421.7 419.8,415.8 739.7,412.5 1010,425.2" class="line real-inc"/>
  <polyline points="100,427.5 156.3,436.4 196.3,433.2 252.6,435 323.6,416.7 419.8,392.3 739.7,282.6 1010,147.6" class="line real-random"/>
  <polyline points="100,454.2 156.3,446.1 196.3,436.8 252.6,432.5 323.6,426.2 419.8,429 739.7,424 1010,427.3" class="line int-inc"/>
  <polyline points="100,454 156.3,446.1 196.3,425.7 252.6,424.6 323.6,413.9 419.8,384.2 739.7,279.6 1010,152.4" class="line int-random"/>

  <g class="real-inc">
    <circle cx="100" cy="420.6" r="4" class="point"/><circle cx="156.3" cy="418.8" r="4" class="point"/>
    <circle cx="196.3" cy="419.9" r="4" class="point"/><circle cx="252.6" cy="419.5" r="4" class="point"/>
    <circle cx="323.6" cy="421.7" r="4" class="point"/><circle cx="419.8" cy="415.8" r="4" class="point"/>
    <circle cx="739.7" cy="412.5" r="4" class="point"/><circle cx="1010" cy="425.2" r="4" class="point"/>
  </g>
  <g class="real-random">
    <circle cx="100" cy="427.5" r="4" class="point"/><circle cx="156.3" cy="436.4" r="4" class="point"/>
    <circle cx="196.3" cy="433.2" r="4" class="point"/><circle cx="252.6" cy="435" r="4" class="point"/>
    <circle cx="323.6" cy="416.7" r="4" class="point"/><circle cx="419.8" cy="392.3" r="4" class="point"/>
    <circle cx="739.7" cy="282.6" r="4" class="point"/><circle cx="1010" cy="147.6" r="4" class="point"/>
  </g>
  <g class="int-inc">
    <circle cx="100" cy="454.2" r="4" class="point"/><circle cx="156.3" cy="446.1" r="4" class="point"/>
    <circle cx="196.3" cy="436.8" r="4" class="point"/><circle cx="252.6" cy="432.5" r="4" class="point"/>
    <circle cx="323.6" cy="426.2" r="4" class="point"/><circle cx="419.8" cy="429" r="4" class="point"/>
    <circle cx="739.7" cy="424" r="4" class="point"/><circle cx="1010" cy="427.3" r="4" class="point"/>
  </g>
  <g class="int-random">
    <circle cx="100" cy="454" r="4" class="point"/><circle cx="156.3" cy="446.1" r="4" class="point"/>
    <circle cx="196.3" cy="425.7" r="4" class="point"/><circle cx="252.6" cy="424.6" r="4" class="point"/>
    <circle cx="323.6" cy="413.9" r="4" class="point"/><circle cx="419.8" cy="384.2" r="4" class="point"/>
    <circle cx="739.7" cy="279.6" r="4" class="point"/><circle cx="1010" cy="152.4" r="4" class="point"/>
  </g>

  <g class="tick" text-anchor="middle">
    <text x="100" y="480">0.1%</text><text x="156.3" y="480">0.15%</text>
    <text x="196.3" y="480">0.2%</text><text x="252.6" y="480">0.3%</text>
    <text x="323.6" y="480">0.5%</text><text x="419.8" y="480">1%</text>
    <text x="739.7" y="480">10%</text><text x="1010" y="480">70%</text>
  </g>
  <text x="555" y="503" text-anchor="middle" class="axis-label">Porcentaje de puntos extremos de la frontera (escala logarítmica)</text>

  <g class="legend">
    <line x1="245" y1="532" x2="270" y2="532" class="line real-inc"/><text x="277" y="536">Real · incremental</text>
    <line x1="430" y1="532" x2="455" y2="532" class="line real-random"/><text x="462" y="536">Real · random incremental</text>
    <line x1="690" y1="532" x2="715" y2="532" class="line int-inc"/><text x="722" y="536">Entero · incremental</text>
    <line x1="890" y1="532" x2="915" y2="532" class="line int-random"/><text x="922" y="536">Entero · random</text>
  </g>

  <line x1="55" y1="560" x2="1095" y2="560" stroke="#cbd5e1"/>
  <text x="62" y="590" class="panel-title">B. Nubes uniformes · tiempo al aumentar n</text>
  <text x="62" y="610" class="subtitle">Ambos ejes logarítmicos; tiempos uniformes hasta n = 10⁷.</text>

  <line x1="100" y1="710" x2="540" y2="710" class="grid"/>
  <line x1="100" y1="764" x2="540" y2="764" class="grid"/>
  <line x1="100" y1="818" x2="540" y2="818" class="grid"/>
  <line x1="100" y1="872" x2="540" y2="872" class="grid"/>
  <line x1="100" y1="900" x2="540" y2="900" class="grid"/>
  <line x1="100" y1="710" x2="100" y2="900" class="axis"/>
  <line x1="100" y1="900" x2="540" y2="900" class="axis"/>
  <text x="90" y="714" text-anchor="end" class="tick">1 000</text>
  <text x="90" y="768" text-anchor="end" class="tick">100</text>
  <text x="90" y="822" text-anchor="end" class="tick">10</text>
  <text x="90" y="876" text-anchor="end" class="tick">1</text>
  <text x="90" y="904" text-anchor="end" class="tick">0.3</text>
  <text x="69" y="805" transform="rotate(-90 69 805)" text-anchor="middle" class="axis-label">Tiempo (ms)</text>
  <polyline points="130,880.7 260,823.6 390,767.2 520,710.4" class="line real-inc"/>
  <polyline points="130,883.2 260,825.7 390,768.5 520,710.5" class="line real-random"/>
  <polyline points="130,887.3 260,828.6 390,771.8 520,715.1" class="line int-inc"/>
  <polyline points="130,885.6 260,827 390,769.3 520,711.1" class="line int-random"/>
  <g class="real-inc"><circle cx="130" cy="880.7" r="4" class="point"/><circle cx="260" cy="823.6" r="4" class="point"/><circle cx="390" cy="767.2" r="4" class="point"/><circle cx="520" cy="710.4" r="4" class="point"/></g>
  <g class="real-random"><circle cx="130" cy="883.2" r="4" class="point"/><circle cx="260" cy="825.7" r="4" class="point"/><circle cx="390" cy="768.5" r="4" class="point"/><circle cx="520" cy="710.5" r="4" class="point"/></g>
  <g class="int-inc"><circle cx="130" cy="887.3" r="4" class="point"/><circle cx="260" cy="828.6" r="4" class="point"/><circle cx="390" cy="771.8" r="4" class="point"/><circle cx="520" cy="715.1" r="4" class="point"/></g>
  <g class="int-random"><circle cx="130" cy="885.6" r="4" class="point"/><circle cx="260" cy="827" r="4" class="point"/><circle cx="390" cy="769.3" r="4" class="point"/><circle cx="520" cy="711.1" r="4" class="point"/></g>
  <g class="tick" text-anchor="middle"><text x="130" y="922">10⁴</text><text x="260" y="922">10⁵</text><text x="390" y="922">10⁶</text><text x="520" y="922">10⁷</text></g>
  <text x="320" y="945" text-anchor="middle" class="axis-label">Cantidad de puntos n</text>

  <g class="legend">
    <line x1="110" y1="967" x2="132" y2="967" class="line real-inc"/><text x="139" y="971">Real · incremental</text>
    <line x1="280" y1="967" x2="302" y2="967" class="line real-random"/><text x="309" y="971">Real · random</text>
    <line x1="110" y1="990" x2="132" y2="990" class="line int-inc"/><text x="139" y="994">Entero · incremental</text>
    <line x1="280" y1="990" x2="302" y2="990" class="line int-random"/><text x="309" y="994">Entero · random</text>
  </g>

  <text x="650" y="590" class="panel-title">C. Frontera con lados colineales · n = 10 000</text>
  <text x="650" y="610" class="subtitle">El porcentaje de puntos sobre el borde no aumenta los vértices extremos (h = 4).</text>
  <line x1="700" y1="700" x2="1090" y2="700" class="grid"/>
  <line x1="700" y1="750" x2="1090" y2="750" class="grid"/>
  <line x1="700" y1="800" x2="1090" y2="800" class="grid"/>
  <line x1="700" y1="850" x2="1090" y2="850" class="grid"/>
  <line x1="700" y1="900" x2="1090" y2="900" class="grid"/>
  <line x1="700" y1="700" x2="700" y2="900" class="axis"/>
  <line x1="700" y1="900" x2="1090" y2="900" class="axis"/>
  <text x="690" y="704" text-anchor="end" class="tick">0.8</text>
  <text x="690" y="754" text-anchor="end" class="tick">0.6</text>
  <text x="690" y="804" text-anchor="end" class="tick">0.4</text>
  <text x="690" y="854" text-anchor="end" class="tick">0.2</text>
  <text x="690" y="904" text-anchor="end" class="tick">0</text>
  <text x="658" y="800" transform="rotate(-90 658 800)" text-anchor="middle" class="axis-label">Tiempo (ms)</text>
  <rect x="730" y="728.3" width="26" height="171.7" fill="#2563eb"/>
  <rect x="759" y="825.5" width="26" height="74.5" fill="#dc2626"/>
  <rect x="820" y="798.3" width="26" height="101.7" fill="#2563eb"/>
  <rect x="849" y="825.0" width="26" height="75.0" fill="#dc2626"/>
  <rect x="930" y="760.2" width="26" height="139.8" fill="#2563eb"/>
  <rect x="959" y="830.5" width="26" height="69.5" fill="#dc2626"/>
  <rect x="1020" y="815.3" width="26" height="84.7" fill="#2563eb"/>
  <rect x="1049" y="827.8" width="26" height="72.2" fill="#dc2626"/>
  <g class="tick" text-anchor="middle">
    <text x="757" y="922">Real 10%</text><text x="847" y="942">Real 70%</text>
    <text x="947" y="922">Entero 10%</text><text x="1037" y="942">Entero 70%</text>
  </g>
  <g class="legend">
    <rect x="790" y="967" width="12" height="12" fill="#2563eb"/><text x="808" y="978">Incremental</text>
    <rect x="930" y="967" width="12" height="12" fill="#dc2626"/><text x="948" y="978">Random incremental</text>
  </g>
  <text x="575" y="1030" text-anchor="middle" class="subtitle">Fuentes y resultados exactos: resultados_experimento.csv · se comparan los vértices de ambas cerraduras en cada repetición.</text>
</svg>
